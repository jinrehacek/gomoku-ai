services:
  gomoku:
    build: .
    container_name: gomoku
    restart: unless-stopped
    expose:
      - "8000"
    command:
      - python
      - -m
      - gomoku
      - --serve
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --url
      - "https://gomoku.rehacek.me"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gomoku

volumes:
  caddy_data:
  caddy_config:
